name: Format Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Check Code Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install clang-format 16
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-16

      - name: Install Python dependencies
        run: python3 -m pip install black

      - name: Run clang-format check
        run: python3 scripts/clang_format_diff.py --all --check --clang-format clang-format-16

      - name: Run Black check
        if: ${{ !cancelled() }}
        run: python3 -m black --check scripts infini_train example
